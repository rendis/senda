# Senda Configuration
# Copy this file to config.yaml and adjust values for your environment.
# Environment variables with SENDA_ prefix override these values.

server:
  # Bind address for the HTTP server
  # Env: SENDA_HOST
  host: "0.0.0.0"

  # Port for the HTTP server
  # Env: SENDA_PORT
  port: 8080

  # Maximum duration for reading the entire request
  read_timeout: "30s"

  # Maximum duration before timing out writes of the response
  write_timeout: "30s"

  # Maximum duration to wait for active connections to finish during shutdown
  shutdown_timeout: "15s"

send:
  # Maximum number of logical messages accepted by POST /api/v1/send/batch
  # Env: SENDA_SEND_BATCH_MAX_ITEMS
  batch_max_items: 100

database:
  # PostgreSQL connection URL (required)
  # Env: SENDA_DATABASE_URL
  url: "postgres://senda:senda@localhost:5432/senda?sslmode=disable"

  # Maximum number of open connections to the database
  max_open_conns: 25

  # Minimum number of connections maintained in the pool
  min_conns: 10

  # Maximum amount of time a connection may be reused
  conn_max_lifetime: "5m"

  # Run database migrations on application start
  migrate_on_start: true

oidc:
  # OIDC provider discovery URL (required)
  # Env: SENDA_OIDC_DISCOVERY_URL
  discovery_url: "https://your-provider.example.com/.well-known/openid-configuration"

  # OIDC client ID (required)
  # Env: SENDA_OIDC_CLIENT_ID
  client_id: "your-client-id"

  # OIDC client secret (required)
  # Env: SENDA_OIDC_CLIENT_SECRET
  client_secret: "your-client-secret"

media:
  # Allowed thumbnail hostnames for /public/video-thumbnail.
  # Env: SENDA_MEDIA_THUMBNAIL_ALLOWED_HOSTS (comma-separated)
  thumbnail_allowed_hosts:
    - "img.youtube.com"
    - "i.ytimg.com"

  # Cache TTL for generated thumbnails.
  # Env: SENDA_MEDIA_THUMBNAIL_CACHE_TTL
  thumbnail_cache_ttl: "24h"

  # Maximum number of cached thumbnails.
  # Env: SENDA_MEDIA_THUMBNAIL_CACHE_MAX_ENTRIES
  thumbnail_cache_max_entries: 500

  # Upstream fetch timeout for thumbnail downloads.
  # Env: SENDA_MEDIA_THUMBNAIL_FETCH_TIMEOUT
  thumbnail_fetch_timeout: "10s"

crypto:
  # Master key for AES-256-GCM encryption of adapter credentials.
  # Must be at least 32 characters. (required)
  # Env: SENDA_MASTER_KEY
  master_key: "change-me-to-a-secure-key-at-least-32-chars"

sns:
  # Exact SNS TopicArn expected by the SES inbound webhook.
  # Env: SENDA_SNS_EXPECTED_TOPIC_ARN
  expected_topic_arn: "arn:aws:sns:us-east-1:123456789012:SES-Events"

  # AWS account ID embedded in the TopicArn.
  # Env: SENDA_SNS_EXPECTED_ACCOUNT_ID
  expected_account_id: "123456789012"

  # Replay window for durable SNS deduplication.
  # Env: SENDA_SNS_REPLAY_WINDOW
  replay_window: "15m"

screenshot:
  # Enable headless-browser screenshot capture for template previews.
  # Env: SENDA_SCREENSHOT_ENABLED
  enabled: false

  # Path to the Chromium / headless-shell binary.
  # Env: SENDA_SCREENSHOT_CHROMIUM_PATH
  chromium_path: /headless-shell/headless-shell

  # Maximum time allowed for a single screenshot render.
  # Env: SENDA_SCREENSHOT_TIMEOUT
  timeout: 15s

  # Maximum time allowed for the browser process to start.
  # Env: SENDA_SCREENSHOT_STARTUP_TIMEOUT
  startup_timeout: 5s

  # Maximum rendered page height in pixels (prevents runaway allocations).
  # Env: SENDA_SCREENSHOT_MAX_HEIGHT_PX
  max_height_px: 6000

  # Maximum number of concurrent screenshot renders.
  # Env: SENDA_SCREENSHOT_MAX_CONCURRENT
  max_concurrent: 4

  # Viewport width used for desktop previews.
  # Env: SENDA_SCREENSHOT_DESKTOP_WIDTH_PX
  desktop_width_px: 1280

  # Viewport width used for mobile previews.
  # Env: SENDA_SCREENSHOT_MOBILE_WIDTH_PX
  mobile_width_px: 390

  # How long an idle browser instance is kept alive before being recycled.
  # Env: SENDA_SCREENSHOT_IDLE_TIMEOUT
  idle_timeout: 5m

log:
  # Log level: debug, info, warn, error
  level: "info"

  # Log format: json or text
  format: "json"
