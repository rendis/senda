services:
  senda:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "${SENDA_PORT:-8081}:8080"
    environment:
      SENDA_CONFIG: config/config.example.yaml
      SENDA_DATABASE_URL: postgres://senda:senda@postgres:5432/senda?sslmode=disable
      SENDA_OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://keycloak:8080/realms/senda/.well-known/openid-configuration}
      SENDA_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-senda-web}
      SENDA_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-senda-dev-secret}
      SENDA_MASTER_KEY: ${MASTER_KEY:-dev-master-key-change-in-production}
      SENDA_SMTP_HOST: mailpit
      SENDA_SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started
    # volumes:
    #   - ../:/app  # Uncomment for hot reload (requires Docker Desktop file sharing)

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    command: >
      postgres
        -c shared_preload_libraries=pg_cron
        -c cron.database_name=senda
    environment:
      POSTGRES_USER: senda
      POSTGRES_PASSWORD: senda
      POSTGRES_DB: senda
    ports:
      - "${SENDA_PG_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senda"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    command: start-dev --import-realm
    environment:
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "${KEYCLOAK_PORT:-9090}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
      - "${MAILPIT_UI_PORT:-8026}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    profiles:
      - https

volumes:
  pgdata:
