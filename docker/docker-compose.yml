services:
  senda:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "${SENDA_PORT:-8081}:8080"
    environment:
      SENDA_DATABASE_URL: postgres://senda:senda@postgres:5432/senda?sslmode=disable
      SENDA_OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://keycloak:8080/realms/senda/.well-known/openid-configuration}
      SENDA_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-senda-web}
      SENDA_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-senda-dev-secret}
      SENDA_MASTER_KEY: ${MASTER_KEY:-dev-master-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # volumes:
    #   - ../:/app  # Uncomment for hot reload (requires Docker Desktop file sharing)

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    command: >
      postgres
        -c shared_preload_libraries=pg_cron
        -c cron.database_name=senda
    environment:
      POSTGRES_USER: senda
      POSTGRES_PASSWORD: senda
      POSTGRES_DB: senda
    ports:
      - "${SENDA_PG_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senda"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    environment:
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "${KEYCLOAK_PORT:-9090}:8080"
    volumes:
      - ./keycloak/realm-senda.json:/opt/keycloak/data/import/realm-senda.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    profiles:
      - https

volumes:
  pgdata:
