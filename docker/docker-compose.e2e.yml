services:
  senda:
    build:
      context: ..
      dockerfile: docker/Dockerfile.e2e
    ports:
      - "${SENDA_E2E_PORT:-8090}:8080"
    environment:
      SENDA_DATABASE_URL: postgres://senda:senda@postgres:5432/senda?sslmode=disable
      SENDA_MIGRATIONS_PATH: /migrations
      SENDA_OIDC_MODE: dual
      SENDA_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/senda/.well-known/openid-configuration
      SENDA_OIDC_CLIENT_ID: senda-web
      SENDA_OIDC_TEST_SECRET: e2e-test-jwt-secret-at-least-32-characters-long
      SENDA_MASTER_KEY: e2e-master-key-must-be-at-least-32-characters
      SENDA_SMTP_HOST: mailpit
      SENDA_SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    command: >
      postgres
        -c shared_preload_libraries=pg_cron
        -c cron.database_name=senda
    environment:
      POSTGRES_USER: senda
      POSTGRES_PASSWORD: senda
      POSTGRES_DB: senda
    ports:
      - "${SENDA_E2E_PG_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senda"]
      interval: 3s
      timeout: 2s
      retries: 20

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    command: start-dev --import-realm
    environment:
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "${KEYCLOAK_PORT:-9090}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${SENDA_E2E_SMTP_PORT:-2025}:1025"
      - "${SENDA_E2E_MAILPIT_PORT:-9025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
