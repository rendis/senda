name: Chaos E2E (Observational)

on:
  workflow_dispatch:

permissions:
  contents: read

permissions:
  contents: read

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run chaos suite (non-blocking release gate)
        run: make test-e2e-chaos
