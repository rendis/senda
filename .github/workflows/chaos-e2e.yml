name: Chaos E2E (Observational)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run chaos suite (non-blocking release gate)
        run: make test-e2e-chaos
