name: System PR Gate

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'web/**'
      - 'docker/**'
      - 'migrations/**'
      - 'docs/postman/**'
      - 'test/**'
      - 'cmd/systemtest/**'
      - 'Makefile'
      - '.github/workflows/system-pr-gate.yml'

jobs:
  system-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Install test CLIs
        run: npm install -g newman

      - name: Run system PR gate
        run: make system-pr

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-pr-artifacts
          path: artifacts/system/**
          if-no-files-found: warn
