name: System Nightly Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install pinned pnpm
        working-directory: web
        run: corepack install

      - name: Resolve pnpm store path
        id: pnpm-store
        working-directory: web
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install web dependencies
        run: corepack pnpm --dir web install --frozen-lockfile

      - name: Install test CLIs
        run: |
          export PNPM_HOME="$HOME/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"
          corepack pnpm add --global agent-browser

      - name: Install browser runtime
        run: agent-browser install --with-deps

      - name: Run full nightly gate
        run: make system-nightly

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: system-nightly-artifacts
          path: artifacts/system/**
          if-no-files-found: warn
