name: Frontend Gate

on:
  pull_request:
    paths:
      - 'web/**'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/frontend-gate.yml'
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Frontend gate
        run: make ci-frontend
